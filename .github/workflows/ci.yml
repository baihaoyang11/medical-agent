name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 单测（无需 API Key）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # 单测用 Fake 替掉 Milvus / embedding / LLM，所以只装轻量依赖。
      # 这是刻意的：如果测试依赖重型包，CI 会慢到没人愿意等，最后就没人跑。
      - name: 安装测试依赖
        run: pip install -r requirements-test.txt

      - name: 语法编译检查
        run: python -m compileall -q core agents skills config.py agent.py model1.py vectors1.py

      - name: 运行单测
        run: python -m pytest tests/ -q --tb=short

  config-guard:
    name: 配置自检可用性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 这里不校验 Key（CI 里没有），只验证 validate() 本身能跑、
      # 且在缺 Key 的情况下确实能报出问题 —— 防止有人把自检逻辑改坏了。
      - name: 缺 Key 时必须报错
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from config import config
          problems = config.validate()
          assert problems, "缺 Key 时 validate() 必须返回问题，否则 fail-fast 失效"
          print("捕获到配置问题：")
          for p in problems:
              print("  -", p)
          PY

  eval-reproducible:
    name: 检索评测可复现
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 评测刻意只依赖 numpy：不装 torch、不下载模型、不要 API Key。
      # 想验证"评测链路没坏"，用 hashing embedder 就够了；
      # 真实语义向量（bge）留给本地和发布前跑。
      - name: 安装最小依赖
        run: pip install numpy

      - name: 跑评测（零依赖向量）
        run: python -m eval.run_eval --embedder hashing --no-oracle

      # 断言的不只是"跑完了"，而是"结果是合理的"。
      # 只断言退出码为 0 的话，指标算错也能通过。
      #
      # 读的是 results-hashing.json 而不是 results.json：
      # hashing 的产物不能覆盖 bge 的报告，否则仓库里提交的结论
      # 会和 CI 每次跑出来的分数对不上 —— 那是不可复现。
      - name: 断言结果有效
        run: |
          python - <<'PY'
          import json
          d = json.load(open("eval/results-hashing.json", encoding="utf-8"))
          m, r = d["meta"], d["results"]
          assert m["embedder"] == "hashing", f"embedder 不符: {m['embedder']}"
          assert m["n_queries"] >= 100, f"query 数量异常: {m['n_queries']}"
          assert m["n_docs"] >= 100, f"语料过小: {m['n_docs']}"
          assert {"dense", "sparse", "hybrid", "hybrid+rerank"} <= set(r), "配置缺失"
          for name, res in r.items():
              v = res["overall"]["recall@5"]
              assert 0.0 <= v <= 1.0, f"{name} recall@5 越界: {v}"
          print("评测结果有效：", {k: round(v["overall"]["recall@5"], 3) for k, v in r.items()})
          PY

      # 路由审计只读评测结果，不重新检索，所以可以和上面共用一次产物。
      # 断言兜底率有上限：路由器被改坏（比如所有规则都命中不了）时，
      # 兜底率会飙到 100%，这里能挡住。
      - name: 路由审计
        run: python -m eval.route_audit --into results-hashing.json --out route_audit-hashing

      - name: 断言路由审计有效
        run: |
          python - <<'PY'
          import json
          d = json.load(open("eval/route_audit-hashing.json", encoding="utf-8"))
          assert d["n_queries"] >= 100, f"query 数量异常: {d['n_queries']}"
          assert d["fallback_rate"] < 0.95, f"兜底率异常高: {d['fallback_rate']:.1%}"
          print("路由审计有效：兜底率 "
                f"{d['fallback_rate']:.1%}，真实路由 R@5 {d['r5_actual_routing']:.3f}")
          PY

      # 双库评测只依赖 numpy，和上面共用一次安装。
      # --fast 跳过预算曲线和分类型，CI 里只需要证明链路和断言成立。
      - name: 双库评测（qa_k / pdf_k 链路）
        run: python -m eval.run_dual_eval --embedder hashing --fast

      # 这条断言守的是一个**设计前提**：QA 库只放结论句，所以单靠 QA 路
      # 不可能覆盖全部要点。如果哪天有人把 QA 库改回完整正文，
      # 整个双库评测就失去区分度（第一版就是这么废掉的），这里会立刻红。
      - name: 断言双库评测有效
        run: |
          python - <<'PY'
          import json
          d = json.load(open("eval/dual_results-hashing.json", encoding="utf-8"))
          g = d["grid"]
          assert len(g) >= 20, f"网格不完整: {len(g)} 格"
          qa_only = max(r["point_recall"] for r in g if r["pdf_k"] == 0)
          with_pdf = max(r["point_recall"] for r in g if r["pdf_k"] > 0)
          assert qa_only < with_pdf, (
              f"QA 单路不应达到 PDF 的水平（{qa_only:.3f} vs {with_pdf:.3f}）——"
              "说明 QA 库里不只有结论句，双库评测失去区分度"
          )
          print(f"双库评测有效：QA 单路上限 {qa_only:.3f}，含 PDF 上限 {with_pdf:.3f}")
          PY

      - name: 上传评测报告
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            eval/report-hashing.md
            eval/results-hashing.json
            eval/route_audit-hashing.md
            eval/route_audit-hashing.json
            eval/dual_report-hashing.md
            eval/dual_results-hashing.json

  full-install:
    name: 运行依赖可安装（依赖漂移预警）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # 单独一个 job：失败时能一眼看出是"依赖装不上"而不是"代码坏了"
      - name: 安装完整依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 验证关键模块可导入
        run: |
          python -c "import fastapi, pymilvus, jieba, rank_bm25, numpy, zhipuai; print('运行时依赖导入正常')"
